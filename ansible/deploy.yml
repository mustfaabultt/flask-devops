---
- name: Deploy MHRS Application
  hosts: web
  become: yes
  vars:
    docker_username: "{{ docker_username }}"

  tasks:
    - name: Stop and remove old container
      docker_container:
        name: flask-app
        state: absent

    - name: Remove old image to force fresh pull
      shell: "docker rmi {{ docker_username }}/flask-app:latest || true"

    - name: Pull latest Docker image
      shell: "docker pull {{ docker_username }}/flask-app:latest"

    - name: Run new Docker container
      docker_container:
        name: flask-app
        image: "{{ docker_username }}/flask-app:latest"
        state: started
        ports:
          - "80:8000"
        restart_policy: always
